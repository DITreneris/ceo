<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Two CEO Playbooks, One AI System — CEO AI Operations and CEO AI Strategy playbooks at promptanatomy.ceo">
  <title>Prompt Anatomy — CEO AI System</title>
  <desc>Premium violet social card. Two CEO AI playbooks — Operations for daily workflows and Strategy for decisions and ROI — at promptanatomy.ceo.</desc>

  <defs>
    <linearGradient id="violetField" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5B1F9E"/>
      <stop offset="55%" stop-color="#4A148C"/>
      <stop offset="100%" stop-color="#2E0A52"/>
    </linearGradient>
    <linearGradient id="cardGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#150528" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#violetField)"/>

  <!-- Headline -->
  <text x="80" y="290" font-family="'Inter', -apple-system, 'Segoe UI', Arial, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF" letter-spacing="-0.02em">Two CEO Playbooks.</text>
  <text x="80" y="370" font-family="'Inter', -apple-system, 'Segoe UI', Arial, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF" letter-spacing="-0.02em">One AI System.</text>

  <!-- Right side: dual playbook cards -->
  <g transform="translate(740, 130)" filter="url(#cardShadow)">
    <!-- Operations card (highlighted) -->
    <rect width="380" height="170" rx="16" ry="16" fill="#3D0F77" stroke="#FFB300" stroke-width="1.6"/>
    <rect width="380" height="170" rx="16" ry="16" fill="url(#cardGloss)"/>
    <text x="24" y="38" font-family="'Inter', -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#FFB300" letter-spacing="0.16em">CEO AI PLAYBOOK · 01</text>
    <text x="24" y="100" font-family="'Inter', -apple-system, 'Segoe UI', Arial, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" letter-spacing="-0.02em">Operations</text>
    <text x="24" y="140" font-family="'Inter', -apple-system, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.78)">Daily workflows</text>
  </g>

  <g transform="translate(740, 320)" filter="url(#cardShadow)">
    <!-- Strategy card (neutral) -->
    <rect width="380" height="170" rx="16" ry="16" fill="#5B1F9E" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
    <rect width="380" height="170" rx="16" ry="16" fill="url(#cardGloss)"/>
    <text x="24" y="38" font-family="'Inter', -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="rgba(255,255,255,0.70)" letter-spacing="0.16em">CEO AI PLAYBOOK · 02</text>
    <text x="24" y="100" font-family="'Inter', -apple-system, 'Segoe UI', Arial, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" letter-spacing="-0.02em">Strategy</text>
    <text x="24" y="140" font-family="'Inter', -apple-system, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.78)">Decisions &amp; ROI</text>
  </g>

  <!-- Footer -->
  <line x1="80" y1="560" x2="1120" y2="560" stroke="rgba(255,179,0,0.45)" stroke-width="1"/>
  <text x="80" y="600" font-family="'Inter', -apple-system, 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" letter-spacing="0.18em">PROMPTANATOMY.CEO</text>
  <text x="1120" y="600" text-anchor="end" font-family="'Inter', -apple-system, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.70)" letter-spacing="0.04em">$9.99 + $19.99</text>
</svg>
